[build]
  publish = "."

[dev]
  command = "npm run preview:static"
  targetPort = 8765
  port = 8888
  publish = "."

# Clean URLs (production + netlify dev)
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301

[[redirects]]
  from = "/accessibility"
  to = "/accessibility.html"
  status = 200

[[redirects]]
  from = "/accessibility.html"
  to = "/accessibility"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
